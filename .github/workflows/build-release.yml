name: Build and Publish Release

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Linux
        run: dotnet publish ./ShaderLibrary.CompileTool/ShaderLibrary.CompileTool.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: publish/ShaderLibrary.CompileTool
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
